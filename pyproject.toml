[project]
authors = [{name = "scw97", email = "samcwhitehead@gmail.com"}]
dependencies = []
name = "buzzwatch-analysis"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
buzzwatch_analysis = { path = ".", editable = true }

[tool.pixi.tasks]
nb = "jupyter notebook"

[tool.pixi.dependencies]
opencv = ">=5.0.0,<6"
matplotlib = ">=3.11.1,<4"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.2,<3"
ipykernel = ">=7.3.0,<8"
openpyxl = ">=3.1.5,<4"
cython = ">=3.2.9,<4"
xmltodict = ">=1.0.4,<2"
scikit-learn = ">=1.9.0,<2"
jupyter = ">=1.1.1,<2"
h5py = ">=3.16.0,<4"
pixi-pycharm = ">=0.0.12,<0.0.13"
python-neo = ">=0.14.5,<0.15"
natsort = ">=8.4.0,<9"
tqdm = ">=4.70.0,<5"
scikit-image = ">=0.26.0,<0.27"
pip = ">=26.2.1,<27"
